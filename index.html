<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capsule 23</title><style>body{font:16px system-ui;background:#181818;color:#eee;max-width:520px;margin:auto;padding:20px}h1{letter-spacing:4px;margin-bottom:0}small{color:#aaa}#stage{background:#c7c3ba;border-radius:20px;margin:20px 0;text-align:center}svg{height:350px;width:100%}button,input{font:inherit;border:1px solid #666;border-radius:10px;padding:10px;background:#292929;color:white;cursor:pointer}input{width:75px;text-align:center}section{margin:18px 0}section div{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.sw{width:36px;height:36px;border-radius:50%;padding:0}.active{outline:2px solid white;outline-offset:3px}nav{display:flex;gap:6px;flex-wrap:wrap}#summary{line-height:1.7;color:#ccc}#saved button{margin:4px}</style><h1>CAPSULE / 23</h1><small>7 barev · 1 176 outfitů</small><div id="stage"></div><nav><button onclick="go(i-1)">❮</button><input id="num" type="number" min="1" max="1176" onchange="go(Math.max(0,Math.min(1175,Math.floor(+this.value||1)-1)))"><button onclick="go(i+1)">❯</button><button onclick="go(i+1+Math.floor(Math.random()*1175))">Náhodný</button><button id="heart" onclick="fav()">♡</button></nav><div id="controls"></div><p id="summary"></p><h3>Oblíbené outfity</h3><div id="saved"></div><small>Stylizované ilustrace, bílé tenisky jako stálý doplněk.</small><script>

none" stroke="#333" opacity=".35"/>`:''}${j?`<path d="M139 94 L114 103 90 127 77 218 102 225 122 149 119 218 150 224 151 110Z M181 94 L206 103 230 127 243 218 218 225 198 149 201 218 170 224 169 110Z" fill="${jc}" stroke="#555"/><path d="M130 174 L145 170 M190 174 L175 170" stroke="#888"/>`:''}</svg>`;let opts=[names,names,['Bez mikiny',...names],['Bez bundy','Černá','Béžová']];$('controls').innerHTML=opts.map((o,k)=>`<section><strong>${['Tričko','Kalhoty','Mikina','Bunda'][k]}</strong> · ${o[a[k]]}<div>${o.map((n,v)=>`<button aria-label="${n}" title="${n}" onclick="change(${k},${v})" class="sw ${v===a[k]?'active':''}" style="background:${C[names.indexOf(n)]||'transparent'};color:${[0,5,6].includes(names.indexOf(n))?'white':'#333'}">${n.startsWith('Bez')?'×':v===a[k]?'✓':''}</button>`).join('')}</div></section>`).join('');$('summary').textContent=opts.map((o,k)=>o[a[k]]).join(' · ');$('saved').innerHTML=f.length?f.map(n=>`<button onclick="go(${n})">Look ${n+1}</button>`).join(''):'Zatím žádné.'}render();</script></html>
