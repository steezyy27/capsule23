<!doctype html><html lang=cs><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>CAPSULE 23</title><style>*{box-sizing:border-box}body{background:#171717;color:#eee;font:16px system-ui;max-width:650px;margin:auto;padding:20px}h1{letter-spacing:4px}button,input,select{font:inherit;padding:10px;border:1px solid #666;border-radius:9px;background:#292929;color:white}button{cursor:pointer}section{background:#242424;padding:16px;border-radius:15px;margin:12px 0}label{display:block;margin:8px 0}select{max-width:100%}svg{width:100%;height:340px;background:#b8b3aa;border-radius:12px} .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}small{color:#bbb}button.primary{background:#e5d9c4;color:#222}input[type=color]{width:55px;height:44px;padding:3px}</style><h1>CAPSULE / 23</h1><small>WARDROBE STUDIO 2.0</small><section><div id=count></div><div id=figure></div><div class=row><button id=prev>‹</button><input id=num type=number min=1 style="width:95px"><button id=next>›</button><button class=primary id=random>Náhodný outfit</button><button id=fav>♡</button></div><div id=choices></div></section><section><h2>Můj šatník</h2><form id=add><label>Kategorie <select id=cat></select></label><label>Název / barva <input id=name required placeholder="Např. Navy"></label><label>Odstín <input id=color type=color value="#263b56"></label><label>Střih / typ <select id=cut><option>Regular<option>Oversized<option>Relaxed<option>Baggy<option>Slim<option>Cargo<option>Tenisky<option>Boots<option>Elegantní<option>Kšiltovka<option>Brýle<option>Hodinky<option>Řetízek</select></label><button class=primary>Přidat kus</button></form><div id=inventory></div></section><section><h2>Oblíbené</h2><div id=favorites></div><h2>Týdenní plán</h2><div id=week></div></section><small>Ilustrační náhled. Data zůstávají v tomto prohlížeči; při vymazání dat webu mohou zmizet.</small><script>
const $=id=>document.getElementById(id), cats=['Tričko','Kalhoty','Mikina','Bunda','Boty','Doplněk'], palette=[['Černá','#202020'],['Bílá','#fafafa'],['Krémová','#e7dcc4'],['Béžová','#b9a184'],['Šedá','#858589'],['Olivová','#65674a'],['Tmavě hnědá','#48342b']];let initial=cats.map((_,k)=>(k<3?palette:k===3?[palette[0],palette[3]]:k===4?[palette[1]]:[]).map(([n,c],i)=>({id:k+'-'+i,n,c,cut:['Oversized','Relaxed','Regular','Regular','Tenisky','Regular'][k]})));let data;try{data=JSON.parse(localStorage.getItem('capsule-v2'))}catch(e){}data=data||{items:initial,favs:[],week:{}};let pos=0;const save=()=>{try{localStorage.setItem('capsule-v2',JSON.stringify(data))}catch(e){}};const options=()=>data.items.map((a,k)=>k===2||k===3||k===5?[null,...a]:a.length?a:[null]);const total=()=>options().reduce((n,a)=>n*a.length,1);function decode(i){return options().map(a=>{let v=a[i%a.length];i=Math.floor(i/a.length);return v})}function encode(ids){let m=1,n=0;options().forEach((a,k)=>{n+=Math.max(0,a.findIndex(x=>(x?.id||null)===ids[k]))*m;m*=a.length});return n}const ids=s=>s.map(x=>x?.id||null);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function figure(s){let [t,p,h,j,b,a]=s.map(x=>x?.c||'none');return `<svg viewBox="0 0 300 400"><ellipse cx="150" cy="380" rx="80" ry="8" fill="#0002"/><ellipse cx="150" cy="48" rx="23" ry="29" fill="#c49b80"/><path d="M127 45Q119 10 150 12Q183 10 173 43L160 29 128 35" fill="#302821"/><path d="M140 68V91H160V68" fill="#c49b80"/><path d="M115 197H185L194 275 190 365H160L150 258 140 365H110L106 275Z" fill="${p}" stroke="#3335"/><path d="M110 359H140L145 379H96V371Z M160 359H190L204 371V379H155Z" fill="${b}" stroke="#3335"/><path d="M90 122L78 210 95 217 115 140M210 122L222 210 205 217 185 140" fill="#c49b80"/><path d="M130 85L103 96 78 126 101 148 115 132V207H185V132L199 148 222 126 197 96 170 85Q150 105 130 85Z" fill="${t}" stroke="#3335"/>${h==='none'?'':`<path d="M130 88Q116 65 150 62Q184 65 170 88L198 97 220 126 228 210 208 215 190 142V209H110V142L92 215 72 210 80 126 102 97Z" fill="${h}" stroke="#3335"/><path d="M130 88Q150 110 170 88M141 100V135M159 100V135M130 176H170L178 196H122Z" fill="none" stroke="#3335"/>`}${j==='none'?'':`<path d="M130 86L102 97 80 124 70 210 94 217 111 140V211H140V105Z M170 86L198 97 220 124 230 210 206 217 189 140V211H160V105Z" fill="${j}" stroke="#3336"/>`}${a==='none'?'':`<circle cx="150" cy="92" r="8" fill="${a}" stroke="#333"/>`}</svg>`}function render(){pos=Math.min(pos,total()-1);let s=decode(pos), key=JSON.stringify(ids(s));$('count').textContent=total().toLocaleString('cs-CZ')+' kombinací · '+data.items.flat().length+' kusů';$('figure').innerHTML=figure(s);$('num').value=pos+1;$('num').max=total();$('fav').textContent=data.favs.some(x=>JSON.stringify(x)===key)?'♥':'♡';$('choices').innerHTML=options().map((a,k)=>`<label>${cats[k]} <select data-choice="${k}">${a.map(x=>`<option value="${x?.id||''}" ${(x?.id||null)===(s[k]?.id||null)?'selected':''}>${x?esc(x.n+' / '+x.cut):'Bez vrstvy'}</option>`).join('')}</select></label>`).join('');document.querySelectorAll('[data-choice]').forEach(e=>e.onchange=()=>{let v=ids(s);v[+e.dataset.choice]=e.value||null;pos=encode(v);render()});$('inventory').innerHTML=data.items.map((a,k)=>`<details><summary>${cats[k]} (${a.length})</summary>${a.map(x=>`<p class=row><span style="background:${x.c};width:24px;height:24px;border-radius:50%;border:1px solid #888"></span>${esc(x.n)} · ${esc(x.cut)} <button data-del="${x.id}">×</button></p>`).join('')}</details>`).join('');document.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{data.items=data.items.map(a=>a.filter(x=>x.id!==e.dataset.del));save();render()});$('favorites').innerHTML=data.favs.map((v,i)=>`<p class=row><button data-look="${i}">Outfit ${encode(v)+1}</button><button data-remove="${i}">×</button></p>`).join('')||'Zatím žádné';document.querySelectorAll('[data-look]').forEach(e=>e.onclick=()=>{pos=encode(data.favs[+e.dataset.look]);render();window.scrollTo(0,0)});document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{data.favs.splice(+e.dataset.remove,1);save();render()});$('week').innerHTML=['Po','Út','St','Čt','Pá','So','Ne'].map(d=>`<p class=row>${d} <button data-day="${d}">Uložit aktuální</button>${data.week[d]?`<button data-open="${d}">Outfit ${encode(data.week[d])+1}</button>`:''}</p>`).join('');document.querySelectorAll('[data-day]').forEach(e=>e.onclick=()=>{data.week[e.dataset.day]=ids(s);save();render()});document.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>{pos=encode(data.week[e.dataset.open]);render();window.scrollTo(0,0)})} $('cat').innerHTML=cats.map((c,i)=>`<option value=${i}>${c}</option>`).join('');$('add').onsubmit=e=>{e.preventDefault();data.items[+$('cat').value].push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),n:$('name').value,c:$('color').value,cut:$('cut').value});$('name').value='';save();render()};$('prev').onclick=()=>{pos=(pos+total()-1)%total();render()};$('next').onclick=()=>{pos=(pos+1)%total();render()};$('random').onclick=()=>{pos=Math.floor(Math.random()*total());render()};$('num').onchange=()=>{pos=Math.max(0,Math.min(total()-1,Math.floor(+$('num').value||1)-1));render()};$('fav').onclick=()=>{let v=ids(decode(pos)),i=data.favs.findIndex(x=>JSON.stringify(x)===JSON.stringify(v));if(i<0)data.favs.push(v);else data.favs.splice(i,1);save();render()};render();</script></html>
